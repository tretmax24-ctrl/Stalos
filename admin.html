rror){const a=await db.rpc('is_admin');if(a.error||!a.data){await db.auth.signOut();lastError=a.error?'Admin verification failed: '+a.error.message:'This account is not authorized as a STALOS administrator.';continue}location.href='./admin-home.html';return}lastError=r.error.message}msg.textContent=lastError};</script></body></html>
