<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>STALOS Admin</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>body{font:15px system-ui;margin:0;background:#f4f7fb;color:#172033}.login{max-width:420px;margin:12vh auto;background:#fff;padding:28px;border-radius:18px;box-shadow:0 12px 40px #0001}.field{margin:14px 0}.field label{display:block;font-weight:700;margin-bottom:6px}.field input{width:100%;box-sizing:border-box;border:1px solid #d5dce7;border-radius:10px;padding:12px}.btn{width:100%;background:#071a35;color:#fff;border:0;border-radius:10px;padding:12px 15px;font-weight:800;cursor:pointer}.btn:disabled{opacity:.65;cursor:wait}.msg{margin:12px 0;font-weight:700;min-height:20px}.link{display:block;margin-top:12px;text-align:center}</style></head><body><div class="login"><h1>STALOS Admin</h1><form id="loginForm"><div class="field"><label>Username</label><input id="username" type="text" autocomplete="username" value="stalos" required></div><div class="field"><label>Password</label><input id="password" type="password" autocomplete="current-password" required></div><button id="signIn" class="btn" type="submit">Sign in</button><div id="loginMsg" class="msg"></div></form><a class="link" href="./forgot-password.html">Forgot password?</a></div><script>const db=supabase.createClient('https://ldlvqymrxmiaxjmkrnyj.supabase.co','sb_publishable_FheAOYbTPAqPRqyiM_zBQw_htUJspWa');const form=document.getElementById('loginForm'),msg=document.getElementById('loginMsg'),btn=document.getElementById('signIn');form.onsubmit=async e=>{e.preventDefault();msg.textContent='Signing in…';btn.disabled=true;const username=document.getElementById('username').value.trim().toLowerCase(),password=document.getElementById('password').value;if(username!=='stalos'){msg.textContent='Invalid username or password.';btn.disabled=false;return}try{const r=await fetch('https://ldlvqymrxmiaxjmkrnyj.supabase.co/functions/v1/stalos-login',{method:'POST',headers:{'Content-Type':'application/json','apikey':'sb_publishable_FheAOYbTPAqPRqyiM_zBQw_htUJspWa'},body:JSON.stringify({username,password})});let data=null;try{data=await r.json()}catch{}if(!r.ok||!data?.access_token||!data?.refresh_token){msg.textContent=data?.error||'Invalid username or password.';btn.disabled=false;return}const session=await db.auth.setSession({access_token:data.access_token,refresh_token:data.refresh_token});if(session.error){msg.textContent='Login session could not be created: '+session.error.message;btn.disabled=false;return}const adminCheck=await db.rpc('is_admin');if(adminCheck.error||!adminCheck.data){await db.auth.signOut();msg.textContent=adminCheck.error?'Admin verification failed: '+adminCheck.error.message:'This account is not authorized as a STALOS administrator.';btn.disabled=false;return}location.href='./admin-home.html'}catch(err){msg.textContent='Unable to reach STALOS authentication service.';btn.disabled=false}};</script></body></html>
