<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>STALOS Admin</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><link rel="stylesheet" href="styles.css"><style>body{background:#f5f7fb}.admin{max-width:1100px;margin:auto;padding:30px 18px}.panel{background:#fff;border-radius:16px;padding:22px;margin-bottom:20px;box-shadow:0 8px 30px #00000010}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:16px}.field{margin-bottom:14px}.field label{display:block;font-weight:700;margin-bottom:6px}.field input,.field textarea,.field select{width:100%;padding:11px;border:1px solid #ddd;border-radius:8px}.btnx{border:0;border-radius:8px;padding:11px 16px;font-weight:700;cursor:pointer;background:#0c1e3d;color:white}.danger{background:#a51d2d}.muted{color:#667085}.hidden{display:none!important}.cards{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.stat{padding:18px;background:#f8fafc;border-radius:12px}.stat b{font-size:28px;display:block}@media(max-width:700px){.cards{grid-template-columns:repeat(2,1fr)}}</style></head><body><main class="admin"><header class="panel" style="display:flex;justify-content:space-between;gap:12px;align-items:center"><div><div class="muted">ST. ALOYSIUS SENIOR SECONDARY SCHOOL NABBINGO</div><h1>Admin Dashboard</h1></div><a href="index.html">View site</a></header><section id="login" class="panel" style="max-width:430px;margin:40px auto"><h2>Administrator sign in</h2><p class="muted">Authorized staff only.</p><div class="field"><label>Email</label><input id="email" type="email"></div><div class="field"><label>Password</label><input id="password" type="password"></div><button class="btnx" id="signin">Sign in</button><p id="msg"></p></section><section id="dash" class="hidden"><div class="cards"><div class="stat"><span>Admissions</span><b id="admissions">0</b></div><div class="stat"><span>Messages</span><b id="messages">0</b></div><div class="stat"><span>Events</span><b id="events">0</b></div><div class="stat"><span>Gallery</span><b id="galleryCount">0</b></div></div><div class="panel"><div style="display:flex;justify-content:space-between"><h2>School content</h2><button class="btnx" id="logout">Sign out</button></div><div class="grid"><div class="field"><label>School tagline</label><input id="tagline"></div><div class="field"><label>Phone</label><input id="phone"></div><div class="field"><label>Email</label><input id="schoolEmail"></div><div class="field"><label>Address</label><input id="address"></div></div><div class="field"><label>Hero description</label><textarea id="hero" rows="4"></textarea></div><button class="btnx" id="saveSettings">Save settings</button><p id="saveMsg"></p></div><div class="panel"><h2>Gallery</h2><div class="grid"><div><div class="field"><label>Photo</label><input id="photo" type="file" accept="image/*"></div><div class="field"><label>Caption</label><input id="caption"></div><button class="btnx" id="upload">Upload photo</button><p id="uploadMsg"></p></div><div id="photos" class="grid"></div></div></div><div class="panel"><h2>Recent admissions</h2><div id="admissionList" class="muted">Loading…</div></div><div class="panel"><h2>Recent contact messages</h2><div id="messageList" class="muted">Loading…</div></div></section></main><script>const URL='https://ldlvqymrxmiaxjmkrnyj.supabase.co',KEY='sb_publishable_FheAOYbTPAqPRqyiM_zBQw_htUJspWa',db=supabase.createClient(URL,KEY);const $=x=>document.getElementById(x);async function admin(){const{data:{user}}=await db.auth.getUser();if(!user)return false;const{data}=await db.from('admin_users').select('user_id').eq('user_id',user.id).maybeSingle();return!!data}async function boot(){if(!(await admin()))return;$('login').classList.add('hidden');$('dash').classList.remove('hidden');await loadSettings();await loadData();} $('signin').onclick=async()=>{const{error}=await db.auth.signInWithPassword({email:$('email').value,password:$('password').value});if(error){$('msg').textContent=error.message;return}if(!(await admin())){await db.auth.signOut();$('msg').textContent='This account is not authorized.';return}boot()};$('logout').onclick=async()=>{await db.auth.signOut();location.reload()};async function loadSettings(){const{data}=await db.from('site_settings').select('*');(data||[]).forEach(x=>{const el=$(x.key);if(el)el.value=x.value||''})}async function loadData(){let q=await db.from('admissions_applications').select('*',{count:'exact',head:true});$('admissions').textContent=q.count||0;q=await db.from('contact_messages').select('*',{count:'exact',head:true});$('messages').textContent=q.count||0;q=await db.from('events').select('*',{count:'exact',head:true});$('events').textContent=q.count||0;q=await db.from('gallery_images').select('*',{count:'exact',head:true});$('galleryCount').textContent=q.count||0;const{data:photos}=await db.from('gallery_images').select('*').order('created_at',{ascending:false}).limit(12);$('photos').innerHTML=(photos||[]).map(p=>`<div><img src="${p.image_url}" style="width:100%;height:130px;object-fit:cover;border-radius:8px"><small>${p.caption||''}</small><br><button class="btnx danger" onclick="delPhoto('${p.id}','${p.image_url}')">Delete</button></div>`).join('')||'No photos yet.';const{data:a}=await db.from('admissions_applications').select('*').order('created_at',{ascending:false}).limit(8);$('admissionList').innerHTML=(a||[]).map(x=>`<p><b>${x.name||x.full_name||'Applicant'}</b> · ${x.email||x.phone||''}</p>`).join('')||'No applications yet.';const{data:m}=await db.from('contact_messages').select('*').order('created_at',{ascending:false}).limit(8);$('messageList').innerHTML=(m||[]).map(x=>`<p><b>${x.name||'Visitor'}</b> · ${x.message||x.subject||''}</p>`).join('')||'No messages yet.'} $('saveSettings').onclick=async()=>{const rows=[['tagline',$('tagline').value],['phone',$('phone').value],['schoolEmail',$('schoolEmail').value],['address',$('address').value],['hero',$('hero').value]];for(const[id,value]of rows){await db.from('site_settings').upsert({key:id,value})}$('saveMsg').textContent='Saved.'};$('upload').onclick=async()=>{const f=$('photo').files[0];if(!f)return $('uploadMsg').textContent='Choose an image.';const path=crypto.randomUUID()+'-'+f.name.replace(/[^a-z0-9._-]/gi,'-');let r=await db.storage.from('site-images').upload(path,f,{contentType:f.type});if(r.error)return $('uploadMsg').textContent=r.error.message;const{data:u}=db.storage.from('site-images').getPublicUrl(path);r=await db.from('gallery_images').insert({image_url:u.publicUrl,caption:$('caption').value});$('uploadMsg').textContent=r.error?r.error.message:'Uploaded.';loadData()};window.delPhoto=async(id,url)=>{if(!confirm('Delete this image?'))return;const path=url.split('/site-images/')[1];await db.storage.from('site-images').remove([path]);await db.from('gallery_images').delete().eq('id',id);loadData()};db.auth.getSession().then(boot);</script></body></html>
