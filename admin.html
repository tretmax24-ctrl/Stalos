<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>STALOS Admin</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>body{font:15px system-ui;margin:0;background:#f4f7fb;color:#172033}.login{max-width:420px;margin:12vh auto;background:#fff;padding:28px;border-radius:18px;box-shadow:0 12px 40px #0001}.field{margin:14px 0}.field label{display:block;font-weight:700;margin-bottom:6px}.field input{width:100%;box-sizing:border-box;border:1px solid #d5dce7;border-radius:10px;padding:12px}.btn{width:100%;background:#071a35;color:#fff;border:0;border-radius:10px;padding:12px 15px;font-weight:800;cursor:pointer}.msg{margin:12px 0;font-weight:700;min-height:20px}</style></head><body><div class="login"><h1>STALOS Admin</h1><p>Authorized staff only.</p><form id="loginForm"><div class="field"><label>Email</label><input id="email" type="email" autocomplete="username" required></div><div class="field"><label>Password</label><input id="password" type="password" autocomplete="current-password" required></div><button class="btn" type="submit">Sign in</button><div id="loginMsg" class="msg"></div></form></div><script>const db=supabase.createClient('https://ldlvqymrxmiaxjmkrnyj.supabase.co','sb_publishable_FheAOYbTPAqPRqyiM_zBQw_htUJspWa');const form=document.getElementById('loginForm'),msg=document.getElementById('loginMsg');form.onsubmit=async e=>{e.preventDefault();msg.textContent='Signing in…';const r=await db.auth.signInWithPassword({email:email.value.trim(),password:password.value});if(r.error){msg.textContent=r.error.message;return}const a=await db.rpc('is_admin');if(a.error||!a.data){await db.auth.signOut();msg.textContent=a.error?'Admin verification failed: '+a.error.message:'This account is not authorized as a STALOS administrator.';return}location.href='./admin-home.html'};</script></body></html>
