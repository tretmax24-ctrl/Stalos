<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>STALOS Admin</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>body{font:15px system-ui;margin:0;background:#f4f7fb;color:#172033}.login{max-width:420px;margin:12vh auto;background:#fff;padding:28px;border-radius:18px;box-shadow:0 12px 40px #0001}.field{margin:14px 0}.field label{display:block;font-weight:700;margin-bottom:6px}.field input{width:100%;box-sizing:border-box;border:1px solid #d5dce7;border-radius:10px;padding:12px}.btn{width:100%;background:#071a35;color:#fff;border:0;border-radius:10px;padding:12px 15px;font-weight:800;cursor:pointer}.btn:disabled{opacity:.7;cursor:wait}.msg{margin:12px 0;font-weight:700;min-height:20px}.brand{text-align:center;color:#071a35;letter-spacing:.08em}.brand span{color:#d5a928}</style></head><body><div class="login"><div class="brand"><h1>ST<span>ALOS</span></h1></div><form id="loginForm"><div class="field"><label for="username">Username</label><input id="username" type="text" autocomplete="username" value="stalos" autocapitalize="none" spellcheck="false" required></div><div class="field"><label for="password">Password</label><input id="password" type="password" autocomplete="current-password" required></div><button id="submit" class="btn" type="submit">Sign in</button><div id="loginMsg" class="msg"></div></form></div><script>const db=supabase.createClient('https://ldlvqymrxmiaxjmkrnyj.supabase.co','sb_publishable_FheAOYbTPAqPRqyiM_zBQw_htUJspWa');const form=document.getElementById('loginForm'),msg=document.getElementById('loginMsg'),submit=document.getElementById('submit');form.onsubmit=async e=>{e.preventDefault();submit.disabled=true;msg.textContent='Signing in…';try{const username=document.getElementById('username').value.trim().toLowerCase(),password=document.getElementById('password').value;const r=await fetch('https://ldlvqymrxmiaxjmkrnyj.supabase.co/functions/v1/stalos-login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({username,password})});let data={};try{data=await r.json()}catch{}if(!r.ok)throw new Error(data.error||'Invalid username or password.');const session=await db.auth.setSession({access_token:data.access_token,refresh_token:data.refresh_token});if(session.error)throw session.error;location.href='./admin-home.html'}catch(err){msg.textContent=err.message||'Login failed.';submit.disabled=false}};</script></body></html>
