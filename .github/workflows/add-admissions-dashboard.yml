name: Add admissions applications to dashboard
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  patch-dashboard:
    if: github.event.head_commit.message != 'Add admissions applications to dashboard'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch dashboard
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('admin-dashboard.html')
          s=p.read_text(encoding='utf-8')
          if 'data-p="applications"' in s:
              raise SystemExit(0)
          old='<button data-p="gallery">▧ Gallery</button>'
          new=old+'<button data-p="applications">▤ Admissions Applications</button>'
          if old not in s:
              raise SystemExit('Gallery navigation marker not found')
          s=s.replace(old,new,1)
          old2='</section></main></div><script>'
          new2='</section><section id="applications" class="page"><div class="card"><div class="row" style="justify-content:space-between"><div><h2>Admissions Applications</h2><p class="hint">Review applications submitted through the public admissions form.</p></div><a class="save" href="admissions-applications.html" target="_blank" rel="noopener">Open full applications page</a></div><iframe class="media-frame" src="admissions-applications.html" title="Admissions Applications"></iframe></div></section></main></div><script>'
          if old2 not in s:
              raise SystemExit('Dashboard section marker not found')
          s=s.replace(old2,new2,1)
          p.write_text(s,encoding='utf-8')
          PY
      - name: Commit dashboard patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add admin-dashboard.html
          git commit -m "Add admissions applications to dashboard"
          git push
