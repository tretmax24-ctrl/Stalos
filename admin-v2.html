<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>STALOS Admin CMS</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>body{font:15px system-ui;margin:0;background:#f4f7fb;color:#172033}header{background:#071a35;color:white;padding:18px 22px;display:flex;justify-content:space-between;align-items:center}main{max-width:1200px;margin:auto;padding:22px}.tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:18px}.tabs button{border:0;padding:10px 14px;border-radius:10px;font-weight:700;cursor:pointer}.tabs button.active{background:#071a35;color:#fff}.panel{display:none;background:#fff;padding:20px;border-radius:16px}.panel.active{display:block}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}.full{grid-column:1/-1}.field label{display:block;font-weight:700;margin-bottom:6px}.field input,.field textarea,.field select{width:100%;box-sizing:border-box;border:1px solid #d5dce7;border-radius:10px;padding:11px}.btn{background:#071a35;color:#fff;border:0;border-radius:10px;padding:11px 15px;font-weight:800;cursor:pointer}.btn.secondary{background:#e8eef6;color:#10233f}.btn.danger{background:#b42318}.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.item{border:1px solid #e5e9ef;border-radius:12px;padding:14px;margin:10px 0}.item img{max-width:180px;max-height:100px;object-fit:cover;border-radius:8px}.muted{color:#667085}.msg{margin:10px 0;font-weight:700}.login{max-width:420px;margin:12vh auto;background:#fff;padding:28px;border-radius:18px}.hidden{display:none!important}@media(max-width:700px){.grid{grid-template-columns:1fr}.full{grid-column:auto}main{padding:14px}}</style></head>
<body><div id="login" class="login"><h1>STALOS Admin</h1><p class="muted">Authorized staff only.</p><form id="loginForm"><div class="field"><label>Email</label><input id="email" type="email" required></div><div class="field"><label>Password</label><input id="password" type="password" required></div><button class="btn">Sign in</button><div id="loginMsg" class="msg"></div></form></div>
<div id="app" class="hidden"><header><strong>STALOS Production CMS</strong><button id="logout" class="btn secondary">Sign out</button></header><main><div class="tabs"><button data-tab="home" class="active">Home</button><button data-tab="about">About</button><button data-tab="academics">Academics</button><button data-tab="admissions">Admissions</button><button data-tab="contact">Contact</button><button data-tab="events">Events</button><button data-tab="gallery">Gallery</button></div>
<section id="home" class="panel active"><h2>Homepage</h2><div id="homeFields" class="grid"></div><button id="saveHome" class="btn">Save homepage</button></section>
<section id="about" class="panel"><h2>About page</h2><div id="aboutFields" class="grid"></div><button id="saveAbout" class="btn">Save About</button></section>
<section id="academics" class="panel"><h2>Academics page</h2><div id="academicsFields" class="grid"></div><button id="saveAcademics" class="btn">Save Academics</button></section>
<section id="admissions" class="panel"><h2>Admissions page</h2><div id="admissionsFields" class="grid"></div><button id="saveAdmissions" class="btn">Save Admissions</button></section>
<section id="contact" class="panel"><h2>Contact page</h2><div id="contactFields" class="grid"></div><button id="saveContact" class="btn">Save Contact</button></section>
<section id="events" class="panel"><div class="row" style="justify-content:space-between"><div><h2>Events</h2><p class="muted">Adding an event always INSERTS a new record. Existing events are never replaced.</p></div><button id="newEvent" class="btn">+ Add event</button></div><div id="eventsList"></div></section>
<section id="gallery" class="panel"><div class="row" style="justify-content:space-between"><div><h2>Gallery</h2><p class="muted">Upload photos without removing existing photos.</p></div><button id="newGallery" class="btn">+ Add photo</button></div><div id="galleryList"></div></section>
<div id="msg" class="msg"></div></main></div>
<script>
const URL='https://ldlvqymrxmiaxjmkrnyj.supabase.co',KEY='sb_publishable_FheAOYbTPAqPRqyiM_zBQw_htUJspWa';const db=supabase.createClient(URL,KEY);const $=id=>document.getElementById(id);const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));
const defs={
 home:[['school_name','School name','St. Aloysius Senior Secondary School, Nabbingo','input'],['school_short_name','Short name','STALOS','input'],['hero_title','Hero title','Knowledge is our strength','input'],['hero_description','Hero description','A mixed day and boarding Catholic secondary school providing quality, affordable education in the Archdiocese of Kampala.','textarea'],['home_why_title','Why families heading','Why families choose STALOS','input'],['home_why_text','Why families text','Clear values, steady leadership, and holistic education for every student.','textarea'],['home_academics_title','Academics card title','Quality Academics','input'],['home_academics_text','Academics card text','O-Level and A-Level programmes focused on strong results and practical skills.','textarea'],['home_values_title','Values card title','Values & Character','input'],['home_values_text','Values card text','Catholic foundation that welcomes all, forming disciplined, responsible young people.','textarea'],['home_skills_title','Skills card title','Skills for Life','input'],['home_skills_text','Skills card text','Vocational training, music, sports, and clubs that prepare students beyond the classroom.','textarea'],['home_life_title','Life section title','Life at STALOS','input'],['home_life_text','Life section text','Students, sports, music, and skills — every day on campus.','textarea'],['home_growth_title','Growth section title','Growing with purpose','input'],['home_growth_text','Growth section text','Recent improvements that make a real difference.','textarea'],['home_facilities_title','Facilities title','Facilities','input'],['home_facilities_text','Facilities text','Main hall completed, reliable water system, kitchen and toilets renovated, classrooms refreshed. Next: multi-storey building and perimeter wall.','textarea'],['home_studentlife_title','Student life title','Student life','input'],['home_studentlife_text','Student life text','Music tradition, vocational skills, games, clubs, and a strong PTA.','textarea'],['home_cta_title','Homepage CTA','Ready to apply or visit?','input']],
 about:[['about_heading','Page heading','About STALOS','input'],['about_intro','Introduction','A mixed day and boarding school rooted in Catholic principles, serving Nabbingo since 1986.','textarea'],['about_story_title','Our story title','Our story','input'],['about_story_text','Our story','Opened 2 February 1986 as Pere Bec Secondary School. Renamed St. Aloysius Senior Secondary School on 5 November 2009. Today led by Head Teacher Mr. Matte Paul Remmy Kizito.','textarea'],['about_who_title','Who we are title','Who we are','input'],['about_who_text','Who we are','Catholic-founded, open to all. Holistic education for 549 students (nearly half boarding) and 42 teachers.','textarea'],['about_vision','Vision','Quality and affordable education in the Archdiocese of Kampala.','textarea'],['about_motto','Motto','Knowledge is our strength','input'],['about_foundation','Foundation','Catholic identity, inclusive spirit, responsible citizens.','textarea'],['about_leadership','Leadership heading','Leadership','input'],['about_headteacher','Head Teacher text','Mr. Matte Paul Remmy Kizito — since 2017.','textarea'],['about_governance','Governance text','Board Chair Mr. Jude Musisi; Parish Priest Rev. Fr. Charles Kiggundu; active PTA.','textarea'],['about_completed','Completed projects','Main hall\nWater system\nKitchen & toilets\nClassroom & dormitory upgrades','textarea'],['about_priorities','Next priorities','Multi-storey building\nPerimeter wall','textarea']],
 academics:[['academics_heading','Page heading','Academics','input'],['academics_intro','Introduction','Strong teaching with practical skills and character formation.','textarea'],['academics_olevel_title','O-Level & A-Level title','O-Level & A-Level','input'],['academics_olevel_text','O-Level & A-Level text','Full secondary curriculum with continuous assessment, computers, Wi-Fi, and library support.','textarea'],['academics_holistic_title','Holistic approach title','Holistic approach','input'],['academics_holistic_text','Holistic approach text','Academics alongside music, sports, clubs, and vocational training.','textarea'],['academics_vocational_heading','Vocational heading','Vocational & skills','input'],['academics_tailoring_title','Tailoring title','Tailoring & Hairdressing','input'],['academics_tailoring_text','Tailoring text','Practical skills with market value.','textarea'],['academics_plumbing_title','Plumbing title','Plumbing & Electronics','input'],['academics_plumbing_text','Plumbing text','Technical training for employment.','textarea'],['academics_trades_title','Other trades title','Other trades','input'],['academics_trades_text','Other trades text','Soap, catering, shoe making, and more.','textarea']],
 admissions:[['admissions_heading','Page heading','Admissions','input'],['admissions_intro','Introduction','Day and boarding places at O-Level and A-Level.','textarea'],['admissions_who','Who we admit','Mixed school — boys and girls, day and boarding, subject to capacity.','textarea'],['admissions_fees','Fees overview','O-Level day UGX 280,000 · boarding UGX 550,000\nA-Level day UGX 300,000 · boarding UGX 650,000\nConfirm with the bursar for the current term.','textarea'],['admissions_open','Admissions open','true','select']],
 contact:[['school_name','School name','St. Aloysius Senior Secondary School, Nabbingo','input'],['address','Address','Nabbingo, Wakiso District\nUganda','textarea'],['phone','Phone','+256 782 267719','input'],['email','Email','stalos2017nabbingo@gmail.com','input'],['contact_heading','Contact heading','Contact us','input'],['contact_intro','Contact introduction','We welcome enquiries from parents, guardians, and prospective students.','textarea'],['contact_headteacher','Head Teacher','Mr. Matte Paul Remmy Kizito','input'],['contact_bursar','School Bursar','Wanyana Lillian','input'],['contact_board','Board Chairman','Mr. Jude Musisi','input']]};
const maps={home:{'.hero h1':'hero_title','.hero .hero-text > p':'hero_description','.section-heading.center h2':'home_why_title','.section-heading.center p':'home_why_text'},about:{'.section-heading h2':'about_heading','.section-heading p':'about_intro'},academics:{'.section-heading h2':'academics_heading','.section-heading p':'academics_intro'},admissions:{'.section-heading h2':'admissions_heading','.section-heading p':'admissions_intro'},contact:{'.section-heading h2':'contact_heading','.section-heading p':'contact_intro'}};
async function ensureSettings(){const all=Object.values(defs).flat();const {data}=await db.from('site_settings').select('id');const have=new Set((data||[]).map(x=>x.id));const missing=all.filter(x=>!have.has(x[0])).map(x=>({id:x[0],value:x[2]}));if(missing.length)await db.from('site_settings').insert(missing)}
async function loadFields(){await ensureSettings();const {data}=await db.from('site_settings').select('id,value');const vals=Object.fromEntries((data||[]).map(x=>[x.id,x.value]));for(const [page,items] of Object.entries(defs)){const box=$(page+'Fields');box.innerHTML=items.map(([id,label,def,type])=>{const v=vals[id]??def;if(type==='textarea')return `<div class="field full"><label>${esc(label)}</label><textarea id="f_${id}" rows="3">${esc(v)}</textarea></div>`;if(type==='select')return `<div class="field"><label>${esc(label)}</label><select id="f_${id}"><option value="true" ${v==='true'?'selected':''}>Open / Yes</option><option value="false" ${v==='false'?'selected':''}>Closed / No</option></select></div>`;return `<div class="field"><label>${esc(label)}</label><input id="f_${id}" value="${esc(v)}"></div>`}).join('')}}
async function savePage(page){const items=defs[page];for(const [id] of items){const value=$('f_'+id).value;const {error}=await db.from('site_settings').upsert({id,value,updated_at:new Date().toISOString()},{onConflict:'id'});if(error){show(error.message);return}}show('Saved. Existing content and records were preserved.');}
function show(t){$('msg').textContent=t;setTimeout(()=>$('msg').textContent='',3000)}
document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{document.querySelectorAll('.tabs button').forEach(x=>x.classList.remove('active'));document.querySelectorAll('.panel').forEach(x=>x.classList.remove('active'));b.classList.add('active');$(b.dataset.tab).classList.add('active');if(b.dataset.tab==='events')loadEvents();if(b.dataset.tab==='gallery')loadGallery()});
for(const p of Object.keys(defs))$('save'+p[0].toUpperCase()+p.slice(1)).onclick=()=>savePage(p);
async function isAdmin(){const {data:{user}}=await db.auth.getUser();if(!user)return false;const {data}=await db.from('admin_users').select('user_id').eq('user_id',user.id).maybeSingle();return !!data}
async function boot(){if(await isAdmin()){ $('login').classList.add('hidden');$('app').classList.remove('hidden');loadFields();loadEvents()} }$('loginForm').onsubmit=async e=>{e.preventDefault();const {error}=await db.auth.signInWithPassword({email:$('email').value.trim(),password:$('password').value});if(error)return $('loginMsg').textContent=error.message;if(!(await isAdmin())){await db.auth.signOut();return $('loginMsg').textContent='This account is not authorized.'}$('login').classList.add('hidden');$('app').classList.remove('hidden');loadFields()};$('logout').onclick=async()=>{await db.auth.signOut();location.reload()};
async function uploadImage(file){if(!file)return null;const path='cms/'+crypto.randomUUID()+'-'+file.name.replace(/[^a-z0-9._-]/gi,'-');const r=await db.storage.from('stalos-images').upload(path,file,{contentType:file.type,upsert:false});if(r.error)throw r.error;return db.storage.from('stalos-images').getPublicUrl(path).data.publicUrl}
async function loadEvents(){const {data,error}=await db.from('events').select('*').order('event_date',{ascending:true});if(error)return $('eventsList').innerHTML=esc(error.message);$('eventsList').innerHTML=(data||[]).map(e=>`<div class="item"><div class="row"><strong>${esc(e.title)}</strong><span class="muted">${new Date(e.event_date).toLocaleString()}</span></div><p>${esc(e.description)}</p>${e.image_url?`<img src="${esc(e.image_url)}">`:''}<div class="row"><button class="btn secondary" onclick="editEvent('${e.id}')">Edit</button><button class="btn danger" onclick="removeEvent('${e.id}')">Delete</button></div></div>`).join('')||'<p class="muted">No events yet.</p>'}
function eventForm(item={}){const id=item.id||'';const d=item.event_date?new Date(item.event_date).toISOString().slice(0,16):'';return `<div class="field"><label>Title</label><input id="evTitle" value="${esc(item.title||'')}"></div><div class="field"><label>Description</label><textarea id="evDesc" rows="4">${esc(item.description||'')}</textarea></div><div class="field"><label>Date & time</label><input id="evDate" type="datetime-local" value="${d}"></div><div class="field"><label>Location</label><input id="evLocation" value="${esc(item.location||'')}"></div><div class="field"><label>Picture ${id?'(choose a new one only if you want to replace it)':''}</label><input id="evFile" type="file" accept="image/*"></div><div class="field"><label>Published</label><select id="evPub"><option value="true" ${item.published!==false?'selected':''}>Published</option><option value="false" ${item.published===false?'selected':''}>Draft</option></select></div><div class="row"><button class="btn" id="evSave">Save event</button><button class="btn secondary" id="evCancel">Cancel</button></div>`}
function openBox(html){const box=document.createElement('div');box.className='item';box.style.position='fixed';box.style.left='50%';box.style.top='50%';box.style.transform='translate(-50%,-50%)';box.style.width='min(650px,90vw)';box.style.maxHeight='85vh';box.style.overflow='auto';box.style.background='#fff';box.style.boxShadow='0 20px 70px #0005';box.innerHTML=html;document.body.appendChild(box);return box}
$('newEvent').onclick=()=>{const box=openBox('<h2>Add event</h2>'+eventForm());$('evCancel').onclick=()=>box.remove();$('evSave').onclick=async()=>{try{const image=await uploadImage($('evFile').files[0]);const row={title:$('evTitle').value.trim(),description:$('evDesc').value.trim(),event_date:new Date($('evDate').value).toISOString(),location:$('evLocation').value.trim(),published:$('evPub').value==='true'};if(image)row.image_url=image;const {error}=await db.from('events').insert(row);if(error)throw error;box.remove();show('Event added. Previous events remain untouched.');loadEvents()}catch(e){show(e.message)}}}
window.editEvent=async id=>{const {data}=await db.from('events').select('*').eq('id',id).single();if(!data)return;const box=openBox('<h2>Edit event</h2>'+eventForm(data));$('evCancel').onclick=()=>box.remove();$('evSave').onclick=async()=>{try{const image=await uploadImage($('evFile').files[0]);const row={title:$('evTitle').value.trim(),description:$('evDesc').value.trim(),event_date:new Date($('evDate').value).toISOString(),location:$('evLocation').value.trim(),published:$('evPub').value==='true'};if(image)row.image_url=image;const {error}=await db.from('events').update(row).eq('id',id);if(error)throw error;box.remove();show('Event updated.');loadEvents()}catch(e){show(e.message)}}};window.removeEvent=async id=>{if(!confirm('Delete this event permanently?'))return;const {error}=await db.from('events').delete().eq('id',id);if(error)return show(error.message);loadEvents()};
async function loadGallery(){const {data,error}=await db.from('gallery_images').select('*').order('sort_order',{ascending:true}).order('created_at',{ascending:false});if(error)return $('galleryList').innerHTML=esc(error.message);$('galleryList').innerHTML=(data||[]).map(g=>`<div class="item"><div class="row">${g.image_url?`<img src="${esc(g.image_url)}">`:''}<div><strong>${esc(g.title)}</strong><p>${esc(g.description)}</p><span class="muted">${g.published?'Published':'Draft'}</span></div></div><button class="btn danger" onclick="removeGallery('${g.id}')">Delete</button></div>`).join('')||'<p class="muted">No photos yet.</p>'}
$('newGallery').onclick=()=>{const box=openBox('<h2>Add gallery photo</h2><div class="field"><label>Picture</label><input id="gf" type="file" accept="image/*"></div><div class="field"><label>Title</label><input id="gt"></div><div class="field"><label>Description</label><textarea id="gd"></textarea></div><div class="field"><label>Publish</label><select id="gp"><option value="true">Yes</option><option value="false">No</option></select></div><div class="row"><button class="btn" id="gs">Save photo</button><button class="btn secondary" id="gc">Cancel</button></div>');$('gc').onclick=()=>box.remove();$('gs').onclick=async()=>{try{const image=await uploadImage($('gf').files[0]);if(!image)throw new Error('Choose a picture.');const {error}=await db.from('gallery_images').insert({title:$('gt').value||'STALOS photo',description:$('gd').value||'',image_url:image,sort_order:Date.now(),published:$('gp').value==='true'});if(error)throw error;box.remove();show('Photo added. Existing photos remain.');loadGallery()}catch(e){show(e.message)}}};window.removeGallery=async id=>{if(!confirm('Delete this photo?'))return;const {error}=await db.from('gallery_images').delete().eq('id',id);if(error)return show(error.message);loadGallery()};
db.auth.getSession().then(boot);
</script></body></html>
