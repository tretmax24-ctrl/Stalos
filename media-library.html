<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>STALOS Admin — Media Library</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>:root{--n:#071a35;--g:#d5a928;--bg:#f4f7fb;--line:#e3e8ef;--muted:#667085}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:#172033;font:14px/1.5 system-ui}.wrap{max-width:1200px;margin:auto;padding:24px}.top{display:flex;justify-content:space-between;gap:12px;align-items:center;margin-bottom:18px}.brand{font-size:24px;font-weight:900;color:var(--n);letter-spacing:.08em}.brand span{color:var(--g)}.card{background:#fff;border:1px solid var(--line);border-radius:16px;padding:20px;margin-bottom:18px}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:16px}.field{margin-bottom:12px}.field label{display:block;font-weight:800;margin-bottom:5px}.field input,.field textarea{width:100%;padding:10px;border:1px solid #d4dce7;border-radius:10px;font:inherit}.field textarea{min-height:70px}.btn{border:0;border-radius:10px;padding:10px 14px;font-weight:800;cursor:pointer;background:var(--n);color:#fff}.btn.secondary{background:#edf2f7;color:var(--n)}.btn.danger{background:#b42318}.notice{font-weight:800;min-height:22px;margin:8px 0}.media{border:1px solid var(--line);border-radius:14px;overflow:hidden;background:#fff}.media img{width:100%;height:180px;object-fit:cover;display:block}.media-body{padding:12px}.media h3{margin:0 0 5px}.muted{color:var(--muted)}@media(max-width:600px){.wrap{padding:14px}.top{align-items:flex-start;flex-direction:column}}</style></head><body><div class="wrap"><div class="top"><div><div class="brand">ST<span>ALOS</span></div><div class="muted">Central Media Library</div></div><div><button class="btn secondary" onclick="location.href='admin-dashboard.html'">Back to dashboard</button></div></div><div id="notice" class="notice"></div><section class="card"><h2>Upload media</h2><p class="muted">Upload an image once, keep it in the central library, and reuse its URL in News, Events or Gallery.</p><div class="field"><label>Image</label><input id="file" type="file" accept="image/*"></div><div class="field"><label>Title</label><input id="title" placeholder="e.g. STALOS students"></div><div class="field"><label>Description</label><textarea id="description" placeholder="Optional description"></textarea></div><button class="btn" id="upload">Upload image</button></section><section class="card"><div style="display:flex;justify-content:space-between;align-items:center;gap:10px"><div><h2>Library</h2><p class="muted">Your reusable STALOS images.</p></div><button class="btn secondary" id="refresh">Refresh</button></div><div id="list" class="grid"></div></section></div><script>const db=supabase.createClient('https://ldlvqymrxmiaxjmkrnyj.supabase.co','sb_publishable_FheAOYbTPAqPRqyiM_zBQw_htUJspWa');const $=id=>document.getElementById(id);const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));function note(s){$('notice').textContent=s}async function auth(){const {data:{session}}=await db.auth.getSession();if(!session){location.href='admin.html';return false}const r=await db.rpc('is_admin');if(r.error||!r.data){await db.auth.signOut();location.href='admin.html';return false}return true}async function load(){const r=await db.from('media_library').select('*').order('created_at',{ascending:false});if(r.error){note('Could not load media: '+r.error.message);return}$('list').innerHTML=r.data?.length?r.data.map(m=>`<article class="media"><img src="${esc(m.image_url)}" alt="${esc(m.title)}"><div class="media-body"><h3>${esc(m.title||'Untitled')}</h3><p class="muted">${esc(m.description||'')}</p><button class="btn secondary" onclick="copyUrl('${encodeURIComponent(m.image_url)}')">Copy URL</button> <button class="btn danger" onclick="removeMedia('${m.id}','${encodeURIComponent(m.storage_path||'')}')">Delete</button></div></article>`).join(''):'<p class="muted">No media uploaded yet.</p>'}async function copyUrl(x){await navigator.clipboard.writeText(decodeURIComponent(x));note('Image URL copied.')}async function removeMedia(id,path){if(!confirm('Delete this media item? This removes the library record and its stored file.'))return;const p=decodeURIComponent(path);if(p){const s=await db.storage.from('stalos-images').remove([p]);if(s.error){note('Storage delete failed: '+s.error.message);return}}const r=await db.from('media_library').delete().eq('id',id);if(r.error){note('Could not delete media: '+r.error.message);return}note('Media deleted.');load()}$('upload').onclick=async()=>{const f=$('file').files[0];if(!f){note('Choose an image first.');return}if(!f.type.startsWith('image/')){note('Only image files are allowed.');return}if(f.size>10*1024*1024){note('Image is too large. Maximum is 10 MB.');return}$('upload').disabled=true;$('upload').textContent='Uploading…';const safe=f.name.toLowerCase().replace(/[^a-z0-9._-]/g,'-');const path=`media/${crypto.randomUUID()}-${safe}`;const up=await db.storage.from('stalos-images').upload(path,f,{contentType:f.type,upsert:false});if(up.error){note('Upload failed: '+up.error.message);$('upload').disabled=false;$('upload').textContent='Upload image';return}const {data:url}=db.storage.from('stalos-images').getPublicUrl(path);const ins=await db.from('media_library').insert({title:$('title').value.trim()||f.name,description:$('description').value.trim()||null,image_url:url.publicUrl,storage_path:path});if(ins.error){await db.storage.from('stalos-images').remove([path]);note('Could not save media record: '+ins.error.message)}else{note('✓ Image uploaded to the Media Library.');$('file').value='';$('title').value='';$('description').value='';load()}$('upload').disabled=false;$('upload').textContent='Upload image'};$('refresh').onclick=load;(async()=>{if(await auth())load()})();</script></body></html>
