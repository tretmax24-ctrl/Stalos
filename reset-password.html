<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Reset STALOS Password</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>body{font:15px system-ui;margin:0;background:#f4f7fb;color:#172033}.box{max-width:420px;margin:12vh auto;background:#fff;padding:28px;border-radius:18px;box-shadow:0 12px 40px #0001}.field{margin:14px 0}.field label{display:block;font-weight:700;margin-bottom:6px}.field input{width:100%;box-sizing:border-box;border:1px solid #d5dce7;border-radius:10px;padding:12px}.btn{width:100%;background:#071a35;color:#fff;border:0;border-radius:10px;padding:12px 15px;font-weight:800;cursor:pointer}.msg{margin:12px 0;font-weight:700;min-height:20px}.ok{color:#167044}.err{color:#b42318}</style></head><body><main class="box"><h1>Set your STALOS password</h1><p>Choose a new password for your STALOS administrator account.</p><form id="resetForm"><div class="field"><label for="password">New password</label><input id="password" type="password" autocomplete="new-password" minlength="6" required></div><div class="field"><label for="confirm">Confirm password</label><input id="confirm" type="password" autocomplete="new-password" minlength="6" required></div><button id="submitBtn" class="btn" type="submit">Set password</button><div id="msg" class="msg"></div></form></main><script>const db=supabase.createClient('https://ldlvqymrxmiaxjmkrnyj.supabase.co','sb_publishable_FheAOYbTPAqPRqyiM_zBQw_htUJspWa');const form=document.getElementById('resetForm'),msg=document.getElementById('msg'),passwordInput=document.getElementById('password'),confirmInput=document.getElementById('confirm'),submitBtn=document.getElementById('submitBtn');let ready=false;async function init(){const {data,error}=await db.auth.getSession();if(error){msg.className='msg err';msg.textContent=error.message;return}if(data.session){ready=true;return}msg.className='msg err';msg.textContent='This password-reset link is invalid or has expired. Request a new reset email.';submitBtn.disabled=true}db.auth.onAuthStateChange((event,session)=>{if(event==='PASSWORD_RECOVERY'&&session)ready=true});form.addEventListener('submit',async e=>{e.preventDefault();const newPassword=passwordInput.value,confirmPassword=confirmInput.value;if(!ready){msg.className='msg err';msg.textContent='Your reset link is not active. Request a new one.';return}if(newPassword!==confirmPassword){msg.className='msg err';msg.textContent='Passwords do not match. Please type them again.';return}if(newPassword.length<6){msg.className='msg err';msg.textContent='Password must be at least 6 characters.';return}submitBtn.disabled=true;msg.className='msg';msg.textContent='Saving password…';const {error}=await db.auth.updateUser({password:newPassword});if(error){submitBtn.disabled=false;msg.className='msg err';msg.textContent=error.message;return}msg.className='msg ok';msg.textContent='Password updated successfully. You can now sign in as a STALOS administrator.';setTimeout(()=>location.href='./admin.html',1200)});init();</script></body></html>
