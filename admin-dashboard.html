<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>STALOS Admin Dashboard</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>body{font:15px system-ui;margin:0;background:#f4f7fb;color:#172033}.wrap{max-width:1200px;margin:auto;padding:20px}.card{background:#fff;border-radius:16px;padding:20px;margin-bottom:18px;box-shadow:0 8px 30px #0001}.top{display:flex;justify-content:space-between;align-items:center;gap:12px}.btn{border:0;border-radius:10px;padding:10px 15px;background:#071a35;color:#fff;font-weight:700;cursor:pointer}.btn.secondary{background:#e8eef6;color:#10233f}.tabs{display:flex;gap:8px;flex-wrap:wrap}.tabs button.active{background:#071a35;color:#fff}.panel{display:none}.panel.active{display:block}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}.field label{display:block;font-weight:700;margin-bottom:5px}.field input,.field textarea,.field select{width:100%;box-sizing:border-box;border:1px solid #d5dce7;border-radius:10px;padding:10px}.full{grid-column:1/-1}.msg{font-weight:700;min-height:22px}.item{border:1px solid #e2e7ee;border-radius:12px;padding:14px;margin:10px 0}.item img{max-width:220px;max-height:130px;object-fit:cover;border-radius:8px}.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.muted{color:#667085}@media(max-width:700px){.grid{grid-template-columns:1fr}.full{grid-column:auto}}</style></head><body><div class="wrap"><div class="card"><div class="top"><div><h1>STALOS Admin Dashboard</h1><p id="session" class="muted">Checking administrator session…</p></div><button id="logout" class="btn secondary">Sign out</button></div></div><div class="card"><div class="tabs"><button class="btn active" data-tab="content">Website Content</button><button class="btn" data-tab="events">Events</button><button class="btn" data-tab="gallery">Gallery</button></div></div><div id="content" class="panel active"><div class="card"><h2>Website Content</h2><p class="muted">Changes update individual CMS fields. Saving one field does not delete other content.</p><div id="fields" class="grid"></div><button id="save" class="btn">Save changes</button></div></div><div id="events" class="panel"><div class="card"><div class="row" style="justify-content:space-between"><div><h2>Events</h2><p class="muted">New events are added; existing events stay.</p></div><button id="addEvent" class="btn">+ Add event</button></div><div id="eventForm"></div><div id="eventsList"></div></div></div><div id="gallery" class="panel"><div class="card"><div class="row" style="justify-content:space-between"><div><h2>Gallery</h2><p class="muted">New images are added; existing images stay.</p></div><button id="addGallery" class="btn">+ Add photo</button></div><div id="galleryForm"></div><div id="galleryList"></div></div></div><div id="msg" class="msg"></div></div><script>
const db=supabase.createClient('https://ldlvqymrxmiaxjmkrnyj.supabase.co','sb_publishable_FheAOYbTPAqPRqyiM_zBQw_htUJspWa');const $=id=>document.getElementById(id);const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));function show(x){$('msg').textContent=x;setTimeout(()=>$('msg').textContent='',3500)}
const fields=[['school_name','School name'],['school_short_name','Short name'],['hero_title','Hero title'],['hero_description','Hero description','textarea'],['home_why_title','Why families heading'],['home_why_text','Why families text','textarea'],['home_academics_title','Academics title'],['home_academics_text','Academics text','textarea'],['home_values_title','Values title'],['home_values_text','Values text','textarea'],['home_skills_title','Skills title'],['home_skills_text','Skills text','textarea'],['about_heading','About heading'],['about_intro','About introduction','textarea'],['about_story_title','Story title'],['about_story_text','Story text','textarea'],['about_who_title','Who we are title'],['about_who_text','Who we are text','textarea'],['about_vision','Vision','textarea'],['about_motto','Motto'],['about_foundation','Foundation','textarea'],['academics_heading','Academics heading'],['academics_intro','Academics introduction','textarea'],['academics_olevel_title','O-Level & A-Level title'],['academics_olevel_text','O-Level & A-Level text','textarea'],['academics_holistic_title','Holistic approach title'],['academics_holistic_text','Holistic approach text','textarea'],['admissions_heading','Admissions heading'],['admissions_intro','Admissions introduction','textarea'],['admissions_who','Who we admit','textarea'],['admissions_fees','Fees overview','textarea'],['contact_heading','Contact heading'],['contact_intro','Contact introduction','textarea'],['address','Address','textarea'],['phone','Phone'],['email','Email']];
async function admin(){const {data:{session}}=await db.auth.getSession();if(!session){location.replace('./admin.html');return false}const r=await db.rpc('is_admin');if(r.error||!r.data){await db.auth.signOut();location.replace('./admin.html');return false}$('session').textContent='Signed in as administrator.';return true}async function loadContent(){const r=await db.from('site_settings').select('id,value');if(r.error){show(r.error.message);return}const v=Object.fromEntries((r.data||[]).map(x=>[x.id,x.value]));$('fields').innerHTML=fields.map(([id,label,type])=>`<div class="field ${type==='textarea'?'full':''}"><label>${esc(label)}</label>${type==='textarea'?`<textarea id="f_${id}" rows="3">${esc(v[id]||'')}</textarea>`:`<input id="f_${id}" value="${esc(v[id]||'')}">`}</div>`).join('')}async function saveContent(){for(const [id] of fields){const r=await db.from('site_settings').upsert({id,value:$('f_'+id).value,updated_at:new Date().toISOString()},{onConflict:'id'});if(r.error){show(r.error.message);return}}show('Website content saved. Existing content was preserved.')}async function upload(file){if(!file)return null;const path='cms/'+crypto.randomUUID()+'-'+file.name.replace(/[^a-z0-9._-]/gi,'-');const r=await db.storage.from('stalos-images').upload(path,file,{contentType:file.type});if(r.error)throw r.error;return db.storage.from('stalos-images').getPublicUrl(path).data.publicUrl}async function loadEvents(){const r=await db.from('events').select('*').order('event_date',{ascending:true});if(r.error){show(r.error.message);return}$('eventsList').innerHTML=(r.data||[]).map(e=>`<div class="item"><strong>${esc(e.title)}</strong><div class="muted">${e.event_date?new Date(e.event_date).toLocaleString():''}</div><p>${esc(e.description)}</p>${e.image_url?`<img src="${esc(e.image_url)}">`:''}</div>`).join('')||'<p class="muted">No events yet.</p>'}function eventForm(){ $('eventForm').innerHTML='<div class="grid"><div class="field"><label>Title</label><input id="et"></div><div class="field"><label>Date & time</label><input id="ed" type="datetime-local"></div><div class="field full"><label>Description</label><textarea id="ex" rows="3"></textarea></div><div class="field full"><label>Event picture</label><input id="ei" type="file" accept="image/*"></div></div><button id="saveEvent" class="btn">Add event</button>';$('saveEvent').onclick=async()=>{try{const title=$('et').value.trim();if(!title)return show('Event title is required.');const image=await upload($('ei').files[0]);const r=await db.from('events').insert({title,event_date:$('ed').value||null,description:$('ex').value.trim(),image_url:image,published:true});if(r.error)throw r.error;$('eventForm').innerHTML='';show('Event added. Existing events remain.');await loadEvents()}catch(e){show(e.message)}}}async function loadGallery(){const r=await db.from('gallery_images').select('*').order('sort_order',{ascending:true});if(r.error){show(r.error.message);return}$('galleryList').innerHTML=(r.data||[]).map(g=>`<div class="item">${g.image_url?`<img src="${esc(g.image_url)}">`:''}<strong>${esc(g.title)}</strong><p>${esc(g.description)}</p></div>`).join('')||'<p class="muted">No gallery photos yet.</p>'}function galleryForm(){$('galleryForm').innerHTML='<div class="grid"><div class="field"><label>Title</label><input id="gt"></div><div class="field"><label>Image</label><input id="gi" type="file" accept="image/*"></div><div class="field full"><label>Description</label><textarea id="gx" rows="2"></textarea></div></div><button id="saveGallery" class="btn">Add photo</button>';$('saveGallery').onclick=async()=>{try{const file=$('gi').files[0];if(!file)return show('Choose an image.');const image=await upload(file);const r=await db.from('gallery_images').insert({title:$('gt').value.trim(),description:$('gx').value.trim(),image_url:image,published:true});if(r.error)throw r.error;$('galleryForm').innerHTML='';show('Photo added. Existing photos remain.');await loadGallery()}catch(e){show(e.message)}}}
document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{document.querySelectorAll('[data-tab]').forEach(x=>x.classList.remove('active'));document.querySelectorAll('.panel').forEach(x=>x.classList.remove('active'));b.classList.add('active');$(b.dataset.tab).classList.add('active');if(b.dataset.tab==='events')loadEvents();if(b.dataset.tab==='gallery')loadGallery()});$('save').onclick=saveContent;$('addEvent').onclick=eventForm;$('addGallery').onclick=galleryForm;$('logout').onclick=async()=>{await db.auth.signOut();location.replace('./admin.html')};(async()=>{if(await admin())await loadContent()})();</script></body></html>
