<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>STALOS Admin — Admissions</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>body{font:14px system-ui;margin:0;background:#f4f7fb;color:#172033}.wrap{max-width:1200px;margin:auto;padding:25px}.head{display:flex;justify-content:space-between;align-items:center;gap:15px}.card{background:white;border:1px solid #e3e8ef;border-radius:14px;padding:18px;margin:15px 0}.app{border:1px solid #e3e8ef;border-radius:12px;padding:16px;margin:12px 0}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.muted{color:#667085}.pill{padding:5px 9px;border-radius:999px;background:#edf2f7}.actions{display:flex;gap:8px;flex-wrap:wrap}select,button{padding:9px;border-radius:9px;border:1px solid #ccd5e0}button{cursor:pointer;background:#071a35;color:white}.danger{background:#b42318}@media(max-width:700px){.grid{grid-template-columns:1fr}}</style></head><body><div class="wrap"><div class="head"><div><h1>Admissions Applications</h1><p class="muted">Private administrator view of submitted applications.</p></div><a href="admin-dashboard.html">← Dashboard</a></div><div id="message" class="card">Checking administrator access…</div><div id="list"></div></div><script>const db=supabase.createClient('https://ldlvqymrxmiaxjmkrnyj.supabase.co','sb_publishable_FheAOYbTPAqPRqyiM_zBQw_htUJspWa'),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));async function start(){const {data:{session}}=await db.auth.getSession();if(!session){location.replace('admin.html');return}const a=await db.rpc('is_admin');if(a.error||!a.data){document.getElementById('message').textContent='Administrator access required.';return}document.getElementById('message').remove();load()}async function load(){const {data,error}=await db.from('admissions_applications').select('*').order('created_at',{ascending:false});if(error){document.getElementById('list').innerHTML='<div class="card">Could not load applications: '+esc(error.message)+'</div>';return}document.getElementById('list').innerHTML=data.length?data.map(x=>`<article class="app"><div class="head"><h2>${esc(x.student_name)}</h2><span class="pill">${esc(x.status)}</span></div><div class="grid"><div><b>Gender:</b> ${esc(x.gender)}<br><b>DOB:</b> ${esc(x.date_of_birth)}<br><b>Level:</b> ${esc(x.level)}<br><b>Entry:</b> ${esc(x.entry_class)}<br><b>Residence:</b> ${esc(x.residence)}</div><div><b>Parent/Guardian:</b> ${esc(x.parent_name)} (${esc(x.relationship)})<br><b>Phone:</b> ${esc(x.applicant_phone)}<br><b>Email:</b> ${esc(x.applicant_email)}<br><b>Address:</b> ${esc(x.home_address)}<br><b>Previous school:</b> ${esc(x.previous_school)}</div></div><p><b>Message:</b> ${esc(x.message)}</p><div class="actions"><select onchange="status('${x.id}',this.value)"><option ${x.status==='new'?'selected':''}>new</option><option ${x.status==='reviewing'?'selected':''}>reviewing</option><option ${x.status==='accepted'?'selected':''}>accepted</option><option ${x.status==='rejected'?'selected':''}>rejected</option><option ${x.status==='closed'?'selected':''}>closed</option></select><button class="danger" onclick="removeApp('${x.id}')">Delete</button></div><p class="muted">Submitted ${new Date(x.created_at).toLocaleString()}</p></article>`).join(''):'<div class="card">No applications yet.</div>'}async function status(id,value){const {error}=await db.from('admissions_applications').update({status:value}).eq('id',id);if(error)alert(error.message);else load()}async function removeApp(id){if(!confirm('Delete this application permanently?'))return;const {error}=await db.from('admissions_applications').delete().eq('id',id);if(error)alert(error.message);else load()}start();</script></body></html>
